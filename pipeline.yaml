apiVersion: tekton.dev/v1beta1
kind: Pipeline
metadata:
  name: tax-calculator-pipeline
spec:
  params:
    - name: repo-url
      type: string
      description: Git repository URL to clone
    - name: image-url
      type: string
      description: Container image URL to build and push
  workspaces:
    - name: shared-workspace
      description: Shared workspace for all tasks
  tasks:
    - name: fetch-repository
      taskRef:
        name: git-clone
      workspaces:
        - name: output
          workspace: shared-workspace
      params:
        - name: url
          value: $(params.repo-url)
    - name: run-tests
      runAfter:
        - fetch-repository
      taskRef:
        name: run-unit-tests
      workspaces:
        - name: source
          workspace: shared-workspace
    - name: build-image
      runAfter:
        - run-tests
      taskRef:
        name: build-and-push
      workspaces:
        - name: source
          workspace: shared-workspace
      params:
        - name: image-url
          value: $(params.image-url)
